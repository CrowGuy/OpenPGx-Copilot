# Local development and test PostgreSQL. Not for the server: that is db/compose.server.yaml.
# Start (and re-apply migrations): docker compose -f db/compose.yaml up -d
# Same as the server: image, database name, pgdata path, roles and schemas (db/migrations/).
# Deliberately different from the server (only 127.0.0.1 can reach this, and it holds no real data):
#   - passwords: fixed dev values here and in dev-setup.sh, not Docker secrets
#   - no TLS and no pg_hba.conf: the image defaults accept local scram connections
#   - port bound to 127.0.0.1, not the intranet IP; no pinned subnet (no Docker gateway rule to match)
#   - migrations and dev passwords are applied by the migrate service, not by hand
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: openpgx
      POSTGRES_PASSWORD: postgres   # dev only; port is bound to 127.0.0.1
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d openpgx"]   # TCP: the initdb-time server is socket-only
      interval: 2s
      retries: 30

  migrate:
    image: postgres:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./:/db:ro
    entrypoint: ["sh", "/db/dev-setup.sh"]

volumes:
  pgdata:
